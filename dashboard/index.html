<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onion Dashboard</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --purple:       #7c3aed;
    --purple-dark:  #5b21b6;
    --purple-light: #ede9fe;
    --purple-mid:   #a78bfa;
    --bg:           #0f0f13;
    --surface:      #1a1a24;
    --border:       #2e2e3e;
    --text:         #e2e0f0;
    --muted:        #8882a8;
    --green:        #34d399;
    --yellow:       #fbbf24;
    --red:          #f87171;
    --blue:         #60a5fa;
  }

  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background: var(--bg); color: var(--text); font-size: 14px; }

  /* ── nav ── */
  nav { background: var(--surface); border-bottom: 1px solid var(--border);
        display: flex; align-items: center; padding: 0 24px; height: 52px; gap: 32px; }
  .logo { font-weight: 700; font-size: 18px; color: var(--purple-mid); letter-spacing: 0.5px; }
  .nav-tabs { display: flex; gap: 4px; }
  .tab { padding: 6px 14px; border-radius: 6px; cursor: pointer; color: var(--muted);
         font-size: 13px; transition: all .15s; }
  .tab:hover { color: var(--text); background: var(--border); }
  .tab.active { color: var(--purple-mid); background: rgba(124,58,237,.15); }
  .badge { background: var(--purple); color: #fff; border-radius: 9px;
           font-size: 11px; padding: 1px 7px; margin-left: 6px; }
  .refresh-info { margin-left: auto; color: var(--muted); font-size: 12px; }

  /* ── layout ── */
  main { padding: 24px; max-width: 1300px; margin: 0 auto; }

  /* ── stat cards ── */
  .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-bottom: 28px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border);
               border-radius: 10px; padding: 18px 20px; }
  .stat-label { color: var(--muted); font-size: 12px; text-transform: uppercase;
                letter-spacing: .6px; margin-bottom: 8px; }
  .stat-value { font-size: 28px; font-weight: 700; }
  .stat-card.total   .stat-value { color: var(--purple-mid); }
  .stat-card.pending .stat-value { color: var(--yellow); }
  .stat-card.running .stat-value { color: var(--blue); }
  .stat-card.done    .stat-value { color: var(--green); }
  .stat-card.failed  .stat-value { color: var(--red); }

  /* ── panel ── */
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
  .panel-header { padding: 16px 20px; border-bottom: 1px solid var(--border);
                  display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .panel-title { font-weight: 600; font-size: 15px; }

  /* ── search / filters ── */
  .filters { display: flex; gap: 8px; flex: 1; }
  input[type=text], select {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 6px 11px; font-size: 13px; outline: none; }
  input[type=text] { flex: 1; min-width: 180px; }
  input[type=text]:focus, select:focus { border-color: var(--purple); }
  select option { background: var(--surface); }

  /* ── table ── */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { padding: 10px 16px; text-align: left; font-size: 11px; text-transform: uppercase;
       letter-spacing: .6px; color: var(--muted); border-bottom: 1px solid var(--border);
       white-space: nowrap; }
  td { padding: 11px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(124,58,237,.05); }
  .empty { text-align: center; padding: 40px; color: var(--muted); }

  /* ── badges ── */
  .status { display: inline-flex; align-items: center; gap: 5px;
            padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; }
  .status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .status.pending   { color: var(--yellow); background: rgba(251,191,36,.1); }
  .status.running   { color: var(--blue);   background: rgba(96,165,250,.1); }
  .status.completed { color: var(--green);  background: rgba(52,211,153,.1); }
  .status.failed    { color: var(--red);    background: rgba(248,113,113,.1); }
  .status.idle      { color: var(--green);  background: rgba(52,211,153,.1); }
  .status.busy      { color: var(--blue);   background: rgba(96,165,250,.1); }

  .queue-tag { background: rgba(124,58,237,.2); color: var(--purple-mid);
               border-radius: 5px; padding: 2px 8px; font-size: 12px; }

  /* ── pagination ── */
  .pagination { display: flex; align-items: center; justify-content: flex-end;
                gap: 8px; padding: 14px 20px; border-top: 1px solid var(--border); }
  .page-info { color: var(--muted); font-size: 13px; margin-right: auto; }
  .page-btn { background: var(--bg); border: 1px solid var(--border); color: var(--text);
              border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: 13px; }
  .page-btn:hover:not(:disabled) { border-color: var(--purple); color: var(--purple-mid); }
  .page-btn:disabled { opacity: 0.35; cursor: default; }
  .page-btn.active { background: var(--purple); border-color: var(--purple); color: #fff; }

  .task-name { font-weight: 500; }
  .mono { font-family: "SF Mono", "Fira Code", monospace; font-size: 12px; color: var(--muted); }

  /* ── page tabs ── */
  .page { display: none; }
  .page.active { display: block; }
</style>
</head>
<body>

<nav>
  <span class="logo">🧅 Onion</span>
  <div class="nav-tabs">
    <div class="tab active" onclick="showPage('tasks', this)">
      Tasks <span class="badge" id="nav-total">0</span>
    </div>
    <div class="tab" onclick="showPage('workers', this)">
      Workers <span class="badge" id="nav-workers">0</span>
    </div>
  </div>
  <span class="refresh-info">auto-refresh every 3s</span>
</nav>

<main>
  <!-- ── stats ── -->
  <div class="stats">
    <div class="stat-card total">
      <div class="stat-label">Total</div>
      <div class="stat-value" id="s-total">—</div>
    </div>
    <div class="stat-card pending">
      <div class="stat-label">Pending</div>
      <div class="stat-value" id="s-pending">—</div>
    </div>
    <div class="stat-card running">
      <div class="stat-label">Running</div>
      <div class="stat-value" id="s-running">—</div>
    </div>
    <div class="stat-card done">
      <div class="stat-label">Completed</div>
      <div class="stat-value" id="s-completed">—</div>
    </div>
    <div class="stat-card failed">
      <div class="stat-label">Failed</div>
      <div class="stat-value" id="s-failed">—</div>
    </div>
  </div>

  <!-- ── tasks page ── -->
  <div id="page-tasks" class="page active">
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">Tasks</span>
        <div class="filters">
          <input type="text" id="f-search" placeholder="Search by name or ID…" oninput="page=1;loadTasks()">
          <select id="f-status" onchange="page=1;loadTasks()">
            <option value="">All statuses</option>
            <option value="pending">Pending</option>
            <option value="running">Running</option>
            <option value="completed">Completed</option>
            <option value="failed">Failed</option>
          </select>
          <select id="f-queue" onchange="page=1;loadTasks()">
            <option value="">All queues</option>
          </select>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Status</th>
              <th>Queue</th>
              <th>Retries</th>
              <th>Duration</th>
              <th>Created</th>
              <th>ID</th>
            </tr>
          </thead>
          <tbody id="tasks-body"></tbody>
        </table>
      </div>
      <div class="pagination">
        <span class="page-info" id="page-info"></span>
        <button class="page-btn" id="btn-prev" onclick="changePage(-1)">← Prev</button>
        <span id="page-btns" style="display:flex;gap:4px"></span>
        <button class="page-btn" id="btn-next" onclick="changePage(1)">Next →</button>
      </div>
    </div>
  </div>

  <!-- ── workers page ── -->
  <div id="page-workers" class="page">
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">Workers</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Status</th>
              <th>Current Task</th>
              <th>Processed</th>
              <th>Started</th>
            </tr>
          </thead>
          <tbody id="workers-body"></tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<script>
  let currentPage = 'tasks';
  let knownQueues = new Set();
  let page = 1;
  const LIMIT = 50;

  function showPage(name, el) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById('page-' + name).classList.add('active');
    el.classList.add('active');
    currentPage = name;
  }

  function fmtDuration(ms) {
    if (!ms) return '—';
    if (ms < 1000) return ms + 'ms';
    return (ms / 1000).toFixed(1) + 's';
  }

  function fmtTime(ts) {
    if (!ts || ts.startsWith('0001')) return '—';
    const d = new Date(ts);
    return d.toLocaleTimeString() + ' ' + d.toLocaleDateString();
  }

  function shortId(id) {
    return '<span class="mono" title="' + id + '">' + id.slice(0, 8) + '…</span>';
  }

  async function loadStats() {
    const s = await fetch('/api/stats').then(r => r.json());
    document.getElementById('s-total').textContent     = s.total;
    document.getElementById('s-pending').textContent   = s.pending;
    document.getElementById('s-running').textContent   = s.running;
    document.getElementById('s-completed').textContent = s.completed;
    document.getElementById('s-failed').textContent    = s.failed;
    document.getElementById('nav-total').textContent   = s.total;
  }

  function changePage(delta) {
    page = Math.max(1, page + delta);
    loadTasks();
  }

  async function loadTasks() {
    const search = document.getElementById('f-search').value;
    const status = document.getElementById('f-status').value;
    const queue  = document.getElementById('f-queue').value;
    const params = new URLSearchParams({ search, status, queue, page, limit: LIMIT });
    const res    = await fetch('/api/tasks?' + params).then(r => r.json());
    const tasks  = res.records || [];
    const total  = res.total || 0;
    const pages  = Math.max(1, Math.ceil(total / LIMIT));

    // collect queues for filter dropdown
    tasks.forEach(t => { if (t.Queue) knownQueues.add(t.Queue); });
    const sel = document.getElementById('f-queue');
    const cur = sel.value;
    sel.innerHTML = '<option value="">All queues</option>';
    [...knownQueues].sort().forEach(q => {
      const o = document.createElement('option');
      o.value = q; o.textContent = q;
      if (q === cur) o.selected = true;
      sel.appendChild(o);
    });

    // pagination controls
    const start = (page - 1) * LIMIT + 1;
    const end   = Math.min(page * LIMIT, total);
    document.getElementById('page-info').textContent =
      total ? `${start}–${end} of ${total}` : '0 results';
    document.getElementById('btn-prev').disabled = page <= 1;
    document.getElementById('btn-next').disabled = page >= pages;

    const btnContainer = document.getElementById('page-btns');
    btnContainer.innerHTML = '';
    for (let p2 = Math.max(1, page-2); p2 <= Math.min(pages, page+2); p2++) {
      const b = document.createElement('button');
      b.className = 'page-btn' + (p2 === page ? ' active' : '');
      b.textContent = p2;
      b.onclick = () => { page = p2; loadTasks(); };
      btnContainer.appendChild(b);
    }

    const tbody = document.getElementById('tasks-body');
    if (!tasks.length) {
      tbody.innerHTML = '<tr><td colspan="7" class="empty">No tasks found</td></tr>';
      return;
    }
    tbody.innerHTML = tasks.map(t => `
      <tr>
        <td class="task-name">${t.Name}</td>
        <td><span class="status ${t.Status}">${t.Status}</span></td>
        <td><span class="queue-tag">${t.Queue || '—'}</span></td>
        <td>${t.retry_attempt || 0}</td>
        <td>${fmtDuration(t.duration_ms)}</td>
        <td class="mono">${fmtTime(t.created_at)}</td>
        <td>${shortId(t.id)}</td>
      </tr>`).join('');
  }

  async function loadWorkers() {
    const workers = await fetch('/api/workers').then(r => r.json());
    document.getElementById('nav-workers').textContent = workers.length;
    const tbody = document.getElementById('workers-body');
    if (!workers.length) {
      tbody.innerHTML = '<tr><td colspan="5" class="empty">No workers registered</td></tr>';
      return;
    }
    tbody.innerHTML = workers.map(w => `
      <tr>
        <td class="mono">worker-${w.id}</td>
        <td><span class="status ${w.status}">${w.status}</span></td>
        <td>${w.current_task || '<span style="color:var(--muted)">—</span>'}</td>
        <td>${w.processed}</td>
        <td class="mono">${fmtTime(w.started_at)}</td>
      </tr>`).join('');
  }

  async function refresh() {
    await loadStats();
    await loadTasks();
    await loadWorkers();
  }

  refresh();
  setInterval(refresh, 3000);
</script>
</body>
</html>
